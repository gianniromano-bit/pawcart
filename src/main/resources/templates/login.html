<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Login - PawCart</title>
</head>
<body>
<div th:replace="~{fragments/userbar :: userbar}"></div>
<div class="container my-5" style="max-width:420px">
  <h1 class="h3 mb-3">Log in to PawCart</h1>
  <div class="alert alert-danger" th:if="${param.error}">Invalid username or password.</div>
  <div class="alert alert-success" th:if="${param.logout}">You have been logged out.</div>
  <div class="alert alert-success" th:if="${param.registered}">Account created. Please log in.</div>
  <form th:action="@{/login}" method="post">
    <div class="mb-3">
      <label class="form-label" for="username">Username</label>
      <input id="username" name="username" class="form-control" autofocus required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input id="password" name="password" type="password" class="form-control" required>
    </div>
    <button class="btn btn-primary w-100" type="submit">Log in</button>
  </form>
  <p class="mt-3">No account? <a th:href="@{/register}">Register</a></p>
</div>
</body>
</html>
