<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="userbar" class="d-flex justify-content-end align-items-center gap-2 px-3 py-2 bg-light border-bottom">
  <th:block sec:authorize="isAuthenticated()">
    <span>Logged in as <strong sec:authentication="name"></strong>
      (<span sec:authentication="principal.role"></span>)</span>
    <a class="btn btn-sm btn-outline-dark" sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Admin</a>
    <form th:action="@{/logout}" method="post" class="m-0">
      <button class="btn btn-sm btn-outline-secondary" type="submit">Logout</button>
    </form>
  </th:block>
  <th:block sec:authorize="!isAuthenticated()">
    <a class="btn btn-sm btn-primary" th:href="@{/login}">Login</a>
    <a class="btn btn-sm btn-outline-primary" th:href="@{/register}">Register</a>
  </th:block>
</div>
</body>
</html>
