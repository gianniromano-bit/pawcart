<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Usage in a page: <head th:replace="~{fragments/layout :: head('Page title')}"></head> -->
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | PawCart'">PawCart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/site.css}" rel="stylesheet">
</head>

<body>
<!-- Usage: <nav th:replace="~{fragments/layout :: navbar('home')}"></nav>  (active = home | items | brands | about) -->
<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}">🐾 PawCart</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" th:classappend="${active == 'home'} ? 'active'" th:href="@{/}">Home</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${active == 'items'} ? 'active'" th:href="@{/items}">Shop</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${active == 'brands'} ? 'active'" th:href="@{/brands}">Brands</a></li>
        <li class="nav-item"><a class="nav-link" th:classappend="${active == 'about'} ? 'active'" th:href="@{/about}">About</a></li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" th:href="@{/items/new}">+ Add Item</a></li>
        <!-- D2: add login/logout + logged-in user here, and wrap links with sec:authorize -->
      </ul>
    </div>
  </div>
</nav>

<footer th:fragment="footer" class="bg-dark text-light mt-5 py-4">
  <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
    <span>🐾 PawCart &copy; 2026 · Everything for your pets</span>
    <span class="text-secondary">CPAN-228 Team Project</span>
  </div>
</footer>

<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
