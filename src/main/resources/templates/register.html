<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Register - PawCart</title>
</head>
<body>
<div th:replace="~{fragments/userbar :: userbar}"></div>
<div class="container my-5" style="max-width:480px">
  <h1 class="h3 mb-3">Create an account</h1>
  <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
    <div class="mb-3">
      <label class="form-label" for="username">Username</label>
      <input id="username" class="form-control" th:field="*{username}" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
      <div class="invalid-feedback" th:errors="*{username}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="email">Email</label>
      <input id="email" type="email" class="form-control" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
      <div class="invalid-feedback" th:errors="*{email}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="fullName">Full name</label>
      <input id="fullName" class="form-control" th:field="*{fullName}" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
      <div class="invalid-feedback" th:errors="*{fullName}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input id="password" type="password" class="form-control" th:field="*{password}" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
      <div class="invalid-feedback" th:errors="*{password}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" class="form-control" th:field="*{confirmPassword}" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
      <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
    </div>
    <button class="btn btn-primary" type="submit">Register</button>
    <a class="btn btn-secondary" th:href="@{/login}">Cancel</a>
  </form>
</div>
</body>
</html>
