<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Item saved - PawCart</title>
</head>
<body>
<div class="container my-4">
  <div class="alert alert-success">Item saved.</div>
  <h1 class="h3" th:text="${item.name}"></h1>
  <p th:text="${item.description}"></p>
  <ul>
    <li>SKU: <span th:text="${item.sku}"></span></li>
    <li>Price: $<span th:text="${item.price}"></span></li>
    <li>Brand: <span th:text="${item.brand.name}"></span></li>
    <li>Category: <span th:text="${item.category.name}"></span></li>
    <li>Pet: <span th:text="${item.petType}"></span></li>
    <li>Created: <span th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm')}"></span></li>
  </ul>
  <a class="btn btn-primary" th:href="@{/items/new}">Add another</a>
</div>
</body>
</html>
