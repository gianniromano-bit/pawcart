<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Add Item - PawCart</title>
</head>
<body>
<div th:replace="~{fragments/userbar :: userbar}"></div>
<div class="container my-4" style="max-width:600px">
  <h1 class="h3 mb-3">Add New Item</h1>
  <form th:action="@{/items}" th:object="${itemForm}" method="post" novalidate>
    <div class="mb-3">
      <label class="form-label" for="name">Name</label>
      <input id="name" class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
      <div class="invalid-feedback" th:errors="*{name}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="description">Description</label>
      <textarea id="description" class="form-control" th:field="*{description}" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
      <div class="invalid-feedback" th:errors="*{description}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="sku">SKU</label>
      <input id="sku" class="form-control" th:field="*{sku}" th:classappend="${#fields.hasErrors('sku')} ? 'is-invalid'">
      <div class="invalid-feedback" th:errors="*{sku}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="price">Price</label>
      <input id="price" type="number" step="0.01" class="form-control" th:field="*{price}" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
      <div class="invalid-feedback" th:errors="*{price}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="brandId">Brand</label>
      <select id="brandId" class="form-select" th:field="*{brandId}" th:classappend="${#fields.hasErrors('brandId')} ? 'is-invalid'">
        <option value="">Select...</option>
        <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}"></option>
      </select>
      <div class="invalid-feedback" th:errors="*{brandId}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="categoryId">Category</label>
      <select id="categoryId" class="form-select" th:field="*{categoryId}" th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'">
        <option value="">Select...</option>
        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
      </select>
      <div class="invalid-feedback" th:errors="*{categoryId}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="petType">Pet type</label>
      <select id="petType" class="form-select" th:field="*{petType}" th:classappend="${#fields.hasErrors('petType')} ? 'is-invalid'">
        <option value="">Select...</option>
        <option th:each="p : ${petTypes}" th:value="${p}" th:text="${p}"></option>
      </select>
      <div class="invalid-feedback" th:errors="*{petType}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="imageUrl">Image URL</label>
      <input id="imageUrl" class="form-control" th:field="*{imageUrl}" placeholder="https://...">
    </div>
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-secondary" th:href="@{/}">Cancel</a>
  </form>
</div>
</body>
</html>
